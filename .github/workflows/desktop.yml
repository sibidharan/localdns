name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Stage Windows helper sidecar (app build script needs it)
        if: runner.os == 'Windows'
        working-directory: desktop/app
        run: node scripts/prepare-sidecars.mjs
      # Runs the whole test suite instrumented and enforces the coverage floor.
      # Excluded: the app/daemon bootstrap glue (lib.rs/main.rs, service loops)
      # — validated by the VM E2E playbook, not unit tests.
      - name: Rust tests + coverage gate (>=80% lines)
        if: runner.os != 'Windows'
        run: >
          cargo llvm-cov --workspace --summary-only --fail-under-lines 80
          --ignore-filename-regex 'app.src-tauri.src.(lib|main)\.rs|helper.localdns-(helper|agentd).src.main\.rs'
      # Windows: the app crate's mock-runtime suite is macOS/Linux-only (see
      # its Cargo.toml), so the shell would read 0% here and poison the gate;
      # its logic is measured on the other two OSes. Everything else gates.
      - name: Rust tests + coverage gate (>=80% lines, sans app shell)
        if: runner.os == 'Windows'
        run: >
          cargo llvm-cov --workspace --exclude localdns-app --summary-only
          --fail-under-lines 80
          --ignore-filename-regex 'helper.localdns-(helper|agentd).src.main\.rs'
      - name: App crate tests (uninstrumented)
        if: runner.os == 'Windows'
        run: cargo test -p localdns-app
      - name: Frontend check + tests + coverage gate + build
        working-directory: desktop/app
        run: |
          npm ci
          npm run check
          npx vitest run --coverage
          npm run build
      - name: App compile check
        run: cargo check -p localdns-app

  bundle:
    if: github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Bundle
        working-directory: desktop/app
        run: |
          npm ci
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: localdns-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
