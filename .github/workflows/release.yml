name: release

# Tag vX.Y.Z → build downloadable assets for every platform and attach them
# to a GitHub Release:
#   - macOS:  LocalDNS-macos.zip           (native SwiftUI app, unsigned)
#   - Linux:  .deb / .rpm / .AppImage      (Tauri desktop app + agentd)
#   - Windows: LocalDNS_x64-setup.exe      (NSIS installer + helper service)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app (unsigned)
        run: |
          xcodebuild -project LocalDNS.xcodeproj -scheme LocalDNS \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent \
            build/Build/Products/Release/LocalDNS.app LocalDNS-macos-unsigned-dev.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LocalDNS-macos-unsigned-dev.zip
          body: |
            ## Downloads
            - **Windows**: `LocalDNS_*-setup.exe` — installer, includes the helper service
            - **Linux**: `.deb` / `.rpm` (app + agent + `localdns` CLI) or `.AppImage`
            - **macOS**: `LocalDNS-macos-unsigned-dev.zip` — **unsigned developer build**:
              macOS will warn on first open (right-click → Open). The signed, notarized,
              auto-updating build is coming to the Mac App Store — buying it there funds
              development of all platforms.

  desktop-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Build bundles
        working-directory: desktop/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --bundles deb,rpm,appimage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/appimage/*.AppImage.sig

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build installer (helper staged by beforeBuildCommand)
        working-directory: desktop/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --bundles nsis
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/nsis/*.exe.sig

  # The updater feed: one latest.json the installed apps poll. Built after
  # both bundle jobs so the signatures and asset URLs exist.
  updater-manifest:
    needs: [desktop-linux, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Assemble latest.json from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' -D sigs
          EXE_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets             --jq '.assets[] | select(.name | endswith("setup.exe")) | .url')
          APPIMAGE_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets             --jq '.assets[] | select(.name | endswith(".AppImage")) | .url')
          jq -n             --arg version "${TAG#v}"             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg exe_url "$EXE_URL"             --arg exe_sig "$(cat sigs/*setup.exe.sig)"             --arg app_url "$APPIMAGE_URL"             --arg app_sig "$(cat sigs/*.AppImage.sig)"             '{version: $version, pub_date: $date, platforms: {
               "windows-x86_64": {url: $exe_url, signature: $exe_sig},
               "linux-x86_64": {url: $app_url, signature: $app_sig}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
