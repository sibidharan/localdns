[workspace]
resolver = "2"
members = [
    "crates/localdns-core",
    "crates/localdns-server",
    "crates/localdns-platform",
    "cli/localdns-cli",
    "helper/localdns-helper",
    "helper/localdns-agentd",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.5"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
arc-swap = "1"
dirs = "6"
