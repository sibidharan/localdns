<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the agent daemon) may own the name. -->
  <policy user="root">
    <allow own="org.localdns.LocalDNS"/>
  </policy>
  <!-- Anyone may call; the daemon enforces polkit
       (org.localdns.agent.configure) on mutating methods. -->
  <policy context="default">
    <allow send_destination="org.localdns.LocalDNS"/>
  </policy>
</busconfig>
